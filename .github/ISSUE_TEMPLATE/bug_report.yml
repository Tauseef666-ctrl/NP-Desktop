name: Bug report
description: Report a bug in NP Desktop so it can be fixed fast
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping to improve NP Desktop!

        Please fill in as much information as possible about the bug so that we don't have to
        play "information ping-pong" and can fix it quickly.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I can reproduce the bug with the [latest release](https://github.com/Tauseef666-ctrl/NP-Desktop/releases) (or the latest snapshot build)."
          required: true
        - label: "I made sure there are *no existing issues* - [open](https://github.com/Tauseef666-ctrl/NP-Desktop/issues) or [closed](https://github.com/Tauseef666-ctrl/NP-Desktop/issues?q=is%3Aissue+is%3Aclosed) - about the same problem."
          required: true
        - label: "I have taken the time to fill in all the required details."
          required: true
        - label: "This issue contains only one bug."
          required: true
        - label: "I have read the [contribution guidelines](https://github.com/Tauseef666-ctrl/NP-Desktop/blob/main/CONTRIBUTING.md)."
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Affected platform
      options:
        - Windows desktop
        - Linux desktop
        - Android TV
        - Android phone/tablet
        - Multiple platforms
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Affected version
      description: "In which NP Desktop version did you encounter the bug?"
      placeholder: "e.g. 0.25.5 - shown in the app's About section or in the release name"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system and version
      placeholder: "e.g. Windows 11 24H2, or Android 12 on a Xiaomi Mi Box"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the bug
      description: "What did you do for the bug to show up?"
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: "What actually happens?"

  - type: textarea
    id: screen-media
    attributes:
      label: Screenshots / screen recordings
      description: |
        A screenshot or short recording is worth a thousand words.
        GitHub supports uploading them directly in the text box.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: |
        Anything else that helps: how often it happens, whether a specific video or channel
        triggers it, whether it started after upgrading, etc.
