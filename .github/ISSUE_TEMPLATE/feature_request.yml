name: Feature request
description: Suggest an idea for NP Desktop
labels: [feature request, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping to improve NP Desktop!

        Your ideas are highly welcome - the app is made for its users, after all.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I made sure there are *no existing issues* - [open](https://github.com/Tauseef666-ctrl/NP-Desktop/issues) or [closed](https://github.com/Tauseef666-ctrl/NP-Desktop/issues?q=is%3Aissue+is%3Aclosed) - requesting the same feature."
          required: true
        - label: "I have taken the time to fill in all the required details."
          required: true
        - label: "I have read the [contribution guidelines](https://github.com/Tauseef666-ctrl/NP-Desktop/blob/main/CONTRIBUTING.md)."
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform the feature should target
      options:
        - Windows desktop
        - Linux desktop
        - Android TV
        - Android phone/tablet
        - Multiple platforms
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: "Explain how you want the app's look or behavior to change to suit your needs."
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why do you want this feature?
      description: "Describe the problem or limitation you come across which this feature would solve."
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: "Anything else that helps: sketches, mockups, screenshots of how other apps solve it, etc."
