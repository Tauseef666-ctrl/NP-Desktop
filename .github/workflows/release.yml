name: Release

# One tag publishes every artifact into a single GitHub release:
#   - Windows: .exe + .msi        (desktop)
#   - Linux:   .deb               (desktop)
#   - Android: phone + TV .apk
# Triggered by any `v*` tag, or manually via workflow_dispatch.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-deb
            os: ubuntu-latest
            tasks: ":desktopApp:packageReleaseDeb"
            path: |
              desktopApp/build/compose/binaries/main-release/deb/*.deb
          - label: windows
            os: windows-latest
            tasks: ":desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe"
            path: |
              desktopApp/build/compose/binaries/main-release/msi/*.msi
              desktopApp/build/compose/binaries/main-release/exe/*.exe

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Package desktop distribution
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: Package (android phone + tv)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Use a named branch so the continuous suffix is stable
        # A tag checkout leaves a detached HEAD, which would make the suffix `.continuous.HEAD`.
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "HEAD" ]; then
            git checkout -B dev
          fi

      - name: Build continuous APK (debug-signed, installable)
        run: ./gradlew :app:assembleContinuous --stacktrace

      - name: Locate and name the APK
        id: apk
        run: |
          DIR="app/build/outputs/apk/continuous"
          VERSION_NAME="$(jq -r ".elements[0].versionName" "$DIR/output-metadata.json")"
          APK="$(find "$DIR" -maxdepth 1 -name '*.apk' | head -n 1)"
          OUT="NewPipe_v${VERSION_NAME}_phone_tv.apk"
          cp "$APK" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.out }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package, android]
    if: ${{ needs.package.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Fail when nothing was produced
        run: |
          FILES=$(find dist -type f)
          if [ -z "$FILES" ]; then
            echo "No artifacts were produced." >&2
            exit 1
          fi
          ls -R dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-0.29.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"
          mapfile -t FILES < <(find dist -type f)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$REPO" \
              --target "${GITHUB_SHA}" \
              --title "YT Desktop + Android $TAG" \
              --notes "Windows desktop: .exe + .msi. Linux desktop: .deb. Android: phone + TV .apk (debug-signed continuous build)." \
              --generate-notes
          fi
