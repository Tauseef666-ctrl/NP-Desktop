name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-deb
            os: ubuntu-latest
            tasks: ":desktopApp:packageReleaseDeb"
            path: |
              desktopApp/build/compose/binaries/main-release/deb/*.deb
          - label: windows
            os: windows-latest
            tasks: ":desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe"
            path: |
              desktopApp/build/compose/binaries/main-release/msi/*.msi
              desktopApp/build/compose/binaries/main-release/exe/*.exe

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Package desktop distribution
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    if: ${{ always() && needs.package.result != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Fail when no installer was produced
        run: |
          FILES=$(find dist -type f)
          if [ -z "$FILES" ]; then
            echo "No installers were produced by any platform." >&2
            exit 1
          fi
          ls -R dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-0.29.1-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"
          mapfile -t FILES < <(find dist -type f)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$REPO" \
              --target "${GITHUB_SHA}" \
              --title "NewPipe+ Desktop $TAG" \
              --generate-notes
          fi
