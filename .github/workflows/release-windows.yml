name: Release Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.29.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  build-msi:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build MSI installer
        run: ./gradlew.bat :desktopApp:packageMsi --no-daemon --info
        shell: cmd

      - name: Locate MSI artifact
        id: locate
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi/" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI found in build output"
            exit 1
          }
          Write-Host "Found MSI: $($msi.FullName) ($('{0:N2}' -f ($msi.Length / 1MB)) MB)"
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "MSI_NAME=$($msi.Name)" >> $env:GITHUB_OUTPUT

      - name: Generate SHA-256 checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.locate.outputs.MSI_PATH }}" -Algorithm SHA256).Hash.ToLower()
          $checksumLine = "$hash  ${{ steps.locate.outputs.MSI_NAME }}"
          Write-Host "Checksum: $checksumLine"
          echo $checksumLine | Out-File -Encoding utf8NoBOM -FilePath checksums-sha256.txt
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            ${{ steps.locate.outputs.MSI_PATH }}
            checksums-sha256.txt
          retention-days: 7

  release:
    name: Create / Update GitHub Release
    needs: build-msi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: release-assets/

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "NP Desktop ${{ steps.tag.outputs.TAG }} — Windows"
          body: |
            ## NP Desktop ${{ steps.tag.outputs.TAG }} — Windows Release

            ### 📦 Downloads
            | Platform | File | Format |
            |----------|------|--------|
            | Windows x64 | `${{ needs.build-msi.outputs.msi_name || 'NP-Desktop-Windows.msi' }}` | MSI Installer |

            ### 🔒 Verification
            ```
            SHA-256 checksum is included in checksums-sha256.txt
            ```
            Verify your download:
            ```powershell
            (Get-FileHash .\*.msi -Algorithm SHA256).Hash
            ```

            ### ⚙️ System Requirements
            - Windows 10/11 (x64)
            - JDK 21 runtime (bundled in installer)

            ### 📝 What's Included
            - Modern desktop UI with Compose Desktop
            - Side rail navigation, resizable window, fullscreen modes
            - YouTube-like keyboard shortcuts
            - Download manager, local history & subscriptions
            - Multi-service: YouTube, SoundCloud, PeerTube, Bandcamp, media.ccc.de

            ---
            Built with ❤️ from [NewPipe](https://github.com/TeamNewPipe/NewPipe)
          draft: false
          prerelease: false
          files: |
            release-assets/*.msi
            release-assets/checksums-sha256.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
