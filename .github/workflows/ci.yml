name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**'

jobs:
  compile-jvm:
    # Fast feedback loop for contributors: compiles the shared JVM target that every
    # desktop change depends on. The full distributable is built by the release workflows.
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Compile shared JVM target
        run: ./gradlew :shared:compileKotlinJvm --stacktrace

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace
