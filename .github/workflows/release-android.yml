name: Release Android APK

# Publishes an installable, debug-signed "continuous" APK for Android phones and Android TV.
# The `:app` module is a single APK that supports both form factors (leanback launcher + banner),
# so one artifact covers phone and TV.

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Use a named branch so the continuous suffix is stable
        # A tag checkout leaves a detached HEAD, which would make the build suffix `.continuous.HEAD`.
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "HEAD" ]; then
            git checkout -B dev
          fi

      - name: Build continuous APK (debug-signed, installable)
        run: ./gradlew :app:assembleContinuous --stacktrace

      - name: Locate and name the APK
        id: apk
        run: |
          DIR="app/build/outputs/apk/continuous"
          VERSION_NAME="$(jq -r ".elements[0].versionName" "$DIR/output-metadata.json")"
          APK="$(find "$DIR" -maxdepth 1 -name '*.apk' | head -n 1)"
          OUT="NewPipe_v${VERSION_NAME}_phone_tv.apk"
          cp "$APK" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-0.29.1-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"
          APK="${{ steps.apk.outputs.out }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$APK" \
              --repo "$REPO" \
              --target "${GITHUB_SHA}" \
              --title "NewPipe+ Android (phone + TV) $TAG" \
              --notes "Debug-signed \`continuous\` build of the Android app. One APK supports both phones and Android TV. App id is suffixed \`.continuous\`, so it installs alongside any other NewPipe build." \
              --generate-notes
          fi
